dumped_by_timeloop_front_end: true
architecture:
    version: '0.4'
    subtree:
      - name: accelerator_top_level
        attributes:
            version: '0.4'
            technology: "40nm"
            global_cycle_seconds: 1e-9
            has_power_gating: false
            power_gated_at: null
        local:
          - name: GlobalBuffer[1..1]
            class: SRAM
            attributes:
                depth: 16384
                width: 1024
                datawidth: 8
                instances: 1
                meshX: 1
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshY: 1
                technology: "40nm"
                global_cycle_seconds: 1e-9
                power_gated_at: null
            required_actions:
              - write
              - read
              - update
              - leak
            enabled: true
          - name: inter_PE_Array_spatial[1..1]
            class: dummy_storage
            attributes:
                width: 1
                depth: 1
                datawidth: 1
                technology: -1
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                global_cycle_seconds: 1e-9
                power_gated_at: null
                spatial:
                    meshX: 32
            enabled: true
          - name: Input_Port[1..8]
            class: storage
            subclass: regfile
            attributes:
                depth: 1
                width: 64
                datawidth: 8
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 8
                meshY: 1
                technology: "40nm"
                global_cycle_seconds: 1e-9
                power_gated_at: null
                spatial:
                    meshX: 32
            required_actions:
              - write
              - read
              - update
              - leak
            enabled: true
          - name: inter_MACC_spatial[1..8]
            class: dummy_storage
            attributes:
                width: 1
                depth: 1
                datawidth: 1
                technology: -1
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 8
                meshY: 1
                global_cycle_seconds: 1e-9
                power_gated_at: null
                spatial:
                    meshX: 32
            enabled: true
          - name: MACC[1..64]
            class: intmac
            attributes:
                width: 8
                datawidth: 8
                has_power_gating: false
                meshX: 64
                meshY: 1
                technology: "40nm"
                global_cycle_seconds: 1e-9
                power_gated_at: null
                spatial:
                    meshX: 32
            required_actions:
              - compute
            enabled: true
architecture_constraints:
    targets:
      - type: temporal
        permutation: N
        target: GlobalBuffer
      - type: spatial
        factors: N=1,K=1
        permutation: NKM
        target: inter_PE_Array_spatial
      - factors: K=1,M=1,N=1
        permutation: KMN
        type: temporal
        target: inter_PE_Array_spatial
      - bypass:
          - Weights
          - Inputs
          - Outputs
        type: bypass
        target: inter_PE_Array_spatial
      - type: temporal
        permutation: N
        target: Input_Port
      - type: spatial
        permutation: N
        target: inter_MACC_spatial
      - factors: K=1,M=1,N=1
        permutation: KMN
        type: temporal
        target: inter_MACC_spatial
      - bypass:
          - Weights
          - Inputs
          - Outputs
        type: bypass
        target: inter_MACC_spatial
problem:
    version: '0.4'
    shape:
        name: FullyConnected
        dimensions:
          - K
          - M
          - N
        data_spaces:
          - name: Weights
            projection:
              -   -   - K
                  -   - M
            read_write: false
          - name: Inputs
            projection:
              -   -   - N
                  -   - K
            read_write: false
          - name: Outputs
            projection:
              -   -   - N
                  -   - M
            read_write: true
        coefficients: []
    instance:
        K: 128
        M: 35
        N: 1
        densities: {}
compound_components:
    version: '0.4'
    classes: []
mapping: []
mapper:
    optimization_metrics:
      - edp
    version: '0.4'
    algorithm: random_pruned
    search_size: 1000
    victory_condition: 100
    timeout: 500
    diagnostics: true
    out_prefix: timeloop-mapper
    num_threads: 8
    optimization_metric: []
    sync_interval: null
    log_interval: 1
    log_oaves: false
    log_oaves_mappings: false
    log_stats: false
    log_suboptimal: false
    live_status: false
    penalize_consecutive_bypass_fails: false
    emit_whoop_nest: false
    max_temporal_loops_in_a_mapping: -1
    filter_revisits: false
    max_permutations_per_if_visit: 16
mapspace:
    version: '0.4'
    template: uber
globals:
    version: '0.4'
    environment_variables: {}
    expression_custom_functions: []
    accelergy_plug_ins: []
