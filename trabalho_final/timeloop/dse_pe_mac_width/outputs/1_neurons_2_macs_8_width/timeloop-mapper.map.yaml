mapping:
  - target: inter_MACC_spatial
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Outputs
  - target: Input_Port
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: inter_MACC_spatial
    type: spatial
    factors: K2 M1 N1
    permutation: KMN
    split: 1
  - target: inter_MACC_spatial
    type: temporal
    factors: K1 M1 N1
    permutation: KMN
  - target: Input_Port
    type: temporal
    factors: K1 M1 N1
    permutation: KMN
  - target: GlobalBuffer
    type: temporal
    factors: K64 M35 N1
    permutation: MKN