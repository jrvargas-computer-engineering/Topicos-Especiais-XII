architecture:
  version: 0.4
  nodes:
  - !Container
    name: accelerator
    attributes:
      technology: "40nm" #150
      global_cycle_seconds: 1e-9

  - !Component
    name: GlobalBuffer
    class: SRAM  # SRAM porque precisa ser grande para alimentar o array
    attributes:
      depth: 16384     # Ex: 16KB
      width: 64        # Largura de banda para alimentar o array
      datawidth: 8
      instances: 1     # Único e compartilhado
      meshX: 1

  - !Container 
    name: PE_Array
    attributes: 
      spatial: {meshX: 32}
    constraints: 
      spatial:
        permutation: [N, K, M]
        factors: [N=1, K=1]

  - !Component
    name: Input_Port
    class: storage
    subclass: regfile
    attributes:
      depth: 1
      width: 32
      datawidth: 8
    spatial: {meshX: 1}
    
  - !Component
    name: MACC
    class: intmac
    attributes:
      width: 8
      datawidth: 8
    spatial: {meshX: 4}

