dumped_by_timeloop_front_end: true
architecture:
    version: '0.4'
    subtree:
      - name: accelerator_top_level
        attributes:
            version: '0.4'
            technology: "40nm"
            global_cycle_seconds: 1e-9
            has_power_gating: false
            power_gated_at: null
        local:
          - name: Buffer[1..1]
            class: regfile
            attributes:
                depth: 4096
                width: 32
                datawidth: 32
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                technology: "40nm"
                global_cycle_seconds: 1e-9
                power_gated_at: null
            required_actions:
              - read
              - leak
              - write
              - update
            enabled: true
          - name: MACC[1..1]
            class: intmac
            attributes:
                width: 32
                has_power_gating: false
                instances: 1
                meshX: 1
                meshY: 1
                technology: "40nm"
                global_cycle_seconds: 1e-9
                power_gated_at: null
            required_actions:
              - compute
            enabled: true
architecture_constraints:
    targets:
      - type: temporal
        permutation: N
        target: Buffer
problem:
    version: '0.4'
    shape:
        name: FullyConnected
        dimensions:
          - K
          - M
          - N
        data_spaces:
          - name: Weights
            projection:
              -   -   - K
                  -   - M
            read_write: false
          - name: Inputs
            projection:
              -   -   - N
                  -   - K
            read_write: false
          - name: Outputs
            projection:
              -   -   - N
                  -   - M
            read_write: true
        coefficients: []
    instance:
        K: 100
        M: 35
        N: 1
        densities: {}
compound_components:
    version: '0.4'
    classes: []
mapping: []
mapper:
    optimization_metrics:
      - edp
    version: '0.4'
    algorithm: random_pruned
    search_size: 1000
    victory_condition: 100
    timeout: 500
    out_prefix: timeloop-mapper
    num_threads: 8
    optimization_metric: []
    sync_interval: null
    log_interval: 1
    log_oaves: false
    log_oaves_mappings: false
    log_stats: false
    log_suboptimal: false
    live_status: false
    diagnostics: false
    penalize_consecutive_bypass_fails: false
    emit_whoop_nest: false
    max_temporal_loops_in_a_mapping: -1
    filter_revisits: false
    max_permutations_per_if_visit: 16
mapspace:
    version: '0.4'
    template: uber
globals:
    version: '0.4'
    environment_variables: {}
    expression_custom_functions: []
    accelergy_plug_ins: []
